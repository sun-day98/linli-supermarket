# ============================================================
# 可选 Flyway 迁移 profile（生产数据库版本化用）
# 启用方式：java -jar app.jar --spring.profiles.active=flyway
# 默认不启用：仍用 schema.sql 自动建表，保证演示环境开箱即用。
#
# 注意：迁移脚本 db/migration/V1__init.sql 与 schema.sql 内容一致（15 张表、IF NOT EXISTS）。
# 首次切换时若库中已存在表，Flyway 需要一个 baseline：
#   spring.flyway.baseline-on-migrate=true（见下，已开启）
# 切换后由 Flyway 管理后续 V2/V3... 迁移，DataInitService 的幂等播种不受影响。
# ============================================================
spring:
  sql:
    init:
      # 启用 Flyway 时关闭 script 初始化，避免重复建表
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有库首次接入 Flyway 时，以当前结构为基线，不重复执行 V1
    baseline-on-migrate: true
    baseline-version: 0
