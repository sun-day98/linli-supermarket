server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: linli-supermarket
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/supermarket_h5?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  # 默认关闭 Flyway（演示用 schema.sql）；仅在 flyway profile 中启用。
  flyway:
    enabled: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: false
  global-config:
    db-config:
      id-type: auto

app:
  token:
    # 生产环境务必通过环境变量 APP_TOKEN_SECRET 注入高强度随机密钥。
    # 保留演示默认值是为了开箱即用；使用默认值时启动日志会打印 WARNING。
    secret: ${APP_TOKEN_SECRET:linli-supermarket-demo-secret-key-2026}
    expire-days: 7
  cors:
    # 逗号分隔的允许来源；演示默认 *（前端为纯 Bearer Token，无 Cookie 依赖）。
    # 生产环境通过 APP_CORS_ORIGINS 收紧为具体域名白名单。
    allowed-origins: ${APP_CORS_ORIGINS:*}
  auth:
    # 演示固定验证码；生产接入短信后通过 APP_DEMO_VERIFY_CODE 置空并改走短信校验。
    demo-verify-code: ${APP_DEMO_VERIFY_CODE:123456}
  api:
    # 默认 false：HTTP 200 + body.code（兼容三端前端）。
    # 生产可设 true 启用标准状态码（401/403/400/500），需前端同步 validateStatus 放行 4xx。
    strict-http-status: ${APP_STRICT_HTTP_STATUS:false}
  security:
    # 管理员登录失败限流：5 次失败锁定 15 分钟。
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  sms:
    # 短信服务模式：demo=固定验证码（默认，开箱即用）；real=生产接入真实短信实现。
    mode: ${APP_SMS_MODE:demo}

logging:
  level:
    com.linli.supermarket: INFO
    org.springframework.jdbc.datasource.init: INFO

---
# 无 MySQL 环境时：mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:supermarket;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      # 演示默认开启便于调试；生产用 H2_CONSOLE_ENABLED=false 关闭。
      enabled: ${H2_CONSOLE_ENABLED:true}
      settings:
        # 禁止远程访问控制台，仅本机可用。
        web-allow-others: false
